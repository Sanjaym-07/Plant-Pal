<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlantPal - Smart Crop Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'panel-bg': 'rgba(30, 41, 59, 0.75)', // slate-800 @ 75%
              'panel-border': 'rgba(71, 85, 105, 0.7)', // slate-600 @ 70%
              'primary': '#a78bfa', // vibrant violet
              'secondary': '#34d399', // emerald green
              'text-light': '#f8fafc', // slate-50
              'text-dark': '#cbd5e1', // slate-300
            },
            animation: {
              'fade-in': 'fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1)',
              'slide-in': 'slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
              'float': 'float 4s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
              slideIn: { '0%': { transform: 'translateY(24px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
              float: {
                '0%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-15px)' },
                '100%': { transform: 'translateY(0px)' },
              }
            }
          }
        }
      }
    </script>
